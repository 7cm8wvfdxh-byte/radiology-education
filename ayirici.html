<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Ayırıcı Tanı Motoru — Radyoloji Eğitim</title>
<meta name="description" content="İnteraktif Ayırıcı Tanı Motoru — Bölge ve bulgu bazlı radyolojik ayırıcı tanı arama motoru">
<meta name="theme-color" content="#0f172a">
<meta property="og:title" content="Ayırıcı Tanı Motoru">
<meta property="og:description" content="İnteraktif Ayırıcı Tanı Motoru — Bölge ve bulgu bazlı radyolojik ayırıcı tanı">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#3b82f6;--accent2:#06b6d4;--danger:#f43f5e;--success:#10b981;--warn:#f59e0b;--radius:16px;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s;line-height:1.6;}
body.light{--bg:#f8fafc;--bg2:#ffffff;--bg3:#e2e8f0;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;}
html{scroll-behavior:smooth;}

/* Header */
.header{background:var(--bg2);border-bottom:1px solid var(--bg3);padding:16px 20px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo span{font-size:12px;color:var(--text3);font-weight:500;}
.header-actions{display:flex;gap:8px;}
.header-btn{background:var(--bg);border:1px solid var(--bg3);border-radius:10px;padding:10px 14px;min-height:44px;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;}
.header-btn:active{opacity:0.7;}
@media(hover:hover){.header-btn:hover{border-color:var(--accent);color:var(--accent);}}

/* Main */
.main{max-width:900px;margin:0 auto;padding:20px 16px 80px;}

/* Search */
.search-section{margin-bottom:20px;}
.search-box{position:relative;}
.search-box input{width:100%;background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:14px 16px 14px 44px;color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s;}
.search-box input:focus{border-color:var(--accent);}
.search-box input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:18px;pointer-events:none;}
.clear-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--bg3);border:none;color:var(--text2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:none;align-items:center;justify-content:center;}
.clear-btn.visible{display:flex;}

/* Region Filters */
.region-section{margin-bottom:16px;}
.section-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.region-btns{display:flex;flex-wrap:wrap;gap:6px;}
.region-btn{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:8px 14px;min-height:44px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.region-btn:active{opacity:0.7;}
@media(hover:hover){.region-btn:hover{border-color:var(--accent);color:var(--accent);}}
.region-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.region-btn .count{font-size:10px;opacity:0.7;margin-left:4px;}

/* Finding Tags */
.findings-section{margin-bottom:20px;}
.findings-tags{display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow-y:auto;padding:2px 0;}
.finding-tag{background:var(--bg2);border:1px solid var(--bg3);border-radius:20px;padding:6px 14px;min-height:36px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all 0.2s;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.finding-tag:active{opacity:0.7;}
@media(hover:hover){.finding-tag:hover{border-color:var(--accent2);color:var(--accent2);}}
.finding-tag.active{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.finding-tag .tag-count{font-size:10px;opacity:0.7;}

/* Active Filters Bar */
.active-filters{display:none;margin-bottom:16px;padding:10px 14px;background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;gap:8px;align-items:center;flex-wrap:wrap;}
.active-filters.visible{display:flex;}
.active-filters-label{font-size:11px;color:var(--text3);font-weight:600;white-space:nowrap;}
.active-filter-chip{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:opacity 0.2s;}
.active-filter-chip:hover{opacity:0.8;}
.active-filter-chip.finding-chip{background:var(--accent2);}
.clear-all-btn{background:var(--danger);color:#fff;border:none;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;margin-left:auto;transition:opacity 0.2s;}
.clear-all-btn:hover{opacity:0.8;}

/* Results Info */
.results-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;}
.results-count{font-size:13px;color:var(--text2);}
.results-count strong{color:var(--accent);}
.sort-btn{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:4px 8px;}
.sort-btn:hover{color:var(--accent);}

/* Result Cards */
.results-grid{display:flex;flex-direction:column;gap:10px;}
.result-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s;}
@media(hover:hover){.result-card:hover{border-color:var(--accent);}}
.card-header{padding:16px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;min-height:44px;}
.card-tag{flex-shrink:0;padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.card-tag.common{background:rgba(16,185,129,0.15);color:var(--success);border:1px solid rgba(16,185,129,0.3);}
.card-tag.important{background:rgba(245,158,11,0.15);color:var(--warn);border:1px solid rgba(245,158,11,0.3);}
.card-tag.critical{background:rgba(244,63,94,0.15);color:var(--danger);border:1px solid rgba(244,63,94,0.3);}
.card-info{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;}
.card-region{font-size:11px;color:var(--text3);margin-bottom:6px;}
.card-findings-preview{display:flex;flex-wrap:wrap;gap:4px;}
.card-finding-pill{background:var(--bg);border:1px solid var(--bg3);border-radius:6px;padding:2px 8px;font-size:10px;color:var(--text2);}
.card-finding-pill.matched{background:rgba(6,182,212,0.15);border-color:rgba(6,182,212,0.3);color:var(--accent2);}
.card-chevron{flex-shrink:0;color:var(--text3);font-size:18px;transition:transform 0.3s;margin-top:2px;}
.result-card.expanded .card-chevron{transform:rotate(180deg);}
.card-detail{display:none;padding:0 16px 16px;border-top:1px solid var(--bg3);}
.result-card.expanded .card-detail{display:block;padding-top:14px;}
.detail-section{margin-bottom:12px;}
.detail-section:last-child{margin-bottom:0;}
.detail-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.detail-text{font-size:13px;color:var(--text2);line-height:1.6;}
.detail-findings{display:flex;flex-wrap:wrap;gap:4px;}
.detail-finding{background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:4px 10px;font-size:11px;color:var(--text2);}
.detail-finding.matched{background:rgba(6,182,212,0.15);border-color:rgba(6,182,212,0.3);color:var(--accent2);}
.modality-badge{display:inline-block;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);color:var(--accent);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;margin-right:4px;margin-bottom:4px;}
.match-score{background:var(--bg);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--accent2);flex-shrink:0;}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.5;}
.empty-title{font-size:18px;font-weight:700;color:var(--text2);margin-bottom:8px;}
.empty-desc{font-size:13px;line-height:1.6;}

/* Stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.stat-item{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:14px;text-align:center;}
.stat-num{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px;}

/* Scrollbar */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px;}

/* Responsive */
@media(max-width:640px){
  .logo h1{font-size:17px;}
  .region-btns{gap:4px;}
  .region-btn{padding:6px 10px;font-size:12px;min-height:40px;}
  .stats-bar{grid-template-columns:repeat(3,1fr);gap:6px;}
  .stat-item{padding:10px 6px;}
  .stat-num{font-size:20px;}
  .finding-tag{padding:5px 10px;font-size:11px;min-height:32px;}
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <h1>RadEdu</h1>
      <span>Ayırıcı Tanı</span>
    </a>
    <div class="header-actions">
      <button class="header-btn" id="themeToggle" aria-label="Tema değiştir">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </div>
</header>

<!-- Main Content -->
<main class="main">

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Tanı</div></div>
    <div class="stat-item"><div class="stat-num" id="regionCount">7</div><div class="stat-label">Bölge</div></div>
    <div class="stat-item"><div class="stat-num" id="findingCount">0</div><div class="stat-label">Bulgu</div></div>
  </div>

  <!-- Search -->
  <div class="search-section">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Tanı veya bulgu ara..." autocomplete="off">
      <button class="clear-btn" id="clearSearch" aria-label="Temizle">✕</button>
    </div>
  </div>

  <!-- Region Filters -->
  <div class="region-section">
    <div class="section-label">Vücut Bölgesi</div>
    <div class="region-btns" id="regionBtns"></div>
  </div>

  <!-- Finding Tags -->
  <div class="findings-section">
    <div class="section-label">Bulgular / Özellikler</div>
    <div class="findings-tags" id="findingTags"></div>
  </div>

  <!-- Active Filters -->
  <div class="active-filters" id="activeFilters">
    <span class="active-filters-label">Filtreler:</span>
    <div id="activeFilterChips"></div>
    <button class="clear-all-btn" id="clearAllFilters">Tümünü Temizle</button>
  </div>

  <!-- Results Info -->
  <div class="results-info">
    <div class="results-count" id="resultsCount"></div>
  </div>

  <!-- Results -->
  <div class="results-grid" id="resultsGrid"></div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">🔎</div>
    <div class="empty-title">Sonuç bulunamadı</div>
    <div class="empty-desc">Farklı filtreler veya arama terimleri deneyin</div>
  </div>

</main>

<script>
// ============================================================
// DATABASE: 100 differential diagnoses across 7 regions
// ============================================================
const DATABASE = [
// ==================== BEYİN (Brain) ====================
{name:"Glioblastom (GBM)",region:"Beyin",findings:["ring enhancement","perilesional edema","mass effect","restricted diffusion","necrosis","irregular margins"],modality:["MR","MR Spektroskopi"],keyFeatures:"İrregüler halka tarzı kontrastlanma, santral nekroz, yüksek kolin/NAA oranı. Kelebek gliom: korpus kallozum geçişi.",tag:"critical"},
{name:"Beyin Metastazı",region:"Beyin",findings:["ring enhancement","perilesional edema","mass effect","multiple lesions","gray-white junction"],modality:["MR","BT"],keyFeatures:"Gri-beyaz cevher bileşkesinde multipl lezyonlar, orantısız perilesional ödem. Akciğer, meme, melanom en sık primer.",tag:"critical"},
{name:"Beyin Absesi",region:"Beyin",findings:["ring enhancement","restricted diffusion","perilesional edema","smooth thin rim"],modality:["MR","DWI"],keyFeatures:"Difüzyon kısıtlanması (DWI parlak, ADC düşük) — tümörden ayırt edici. İnce düzgün duvar, medialde daha ince.",tag:"critical"},
{name:"Menenjiyom",region:"Beyin",findings:["homogeneous enhancement","dural tail sign","calcification","extra-axial mass","hyperostosis"],modality:["MR","BT"],keyFeatures:"Ekstra-aksiyel, yoğun homojen kontrastlanma, dural kuyruk işareti. BT'de kalsifikasyon ve komşu kemik hipertrofisi.",tag:"common"},
{name:"Akustik Schwannom",region:"Beyin",findings:["CP angle mass","IAC widening","homogeneous enhancement","ice cream on cone"],modality:["MR"],keyFeatures:"Serebellopontin köşe kitlesi, iç kulak yoluna uzanım (dondurma külahı). T2'de heterojen sinyal.",tag:"common"},
{name:"Epidermoid Kist",region:"Beyin",findings:["restricted diffusion","CP angle mass","T1 dark","T2 bright","no enhancement","cauliflower shape"],modality:["MR","DWI"],keyFeatures:"DWI'da parlak (schwannomdan ayırt edici), kontrastlanmaz. Karnabahar benzeri şekil, BOS'a benzer sinyal.",tag:"important"},
{name:"Akut İskemik İnme",region:"Beyin",findings:["restricted diffusion","vascular territory","loss of gray-white differentiation","hyperdense vessel sign"],modality:["MR","BT","BT Anjio"],keyFeatures:"DWI'da erken (dakikalar içinde) parlak sinyal. Vasküler alan dağılımı, ADC haritasında düşük sinyal.",tag:"critical"},
{name:"Araknoid Kist",region:"Beyin",findings:["T2 bright","T1 dark","no enhancement","CSF signal","smooth margins","no restricted diffusion"],modality:["MR","BT"],keyFeatures:"BOS sinyali ile tamamen uyumlu, kontrastlanmaz, difüzyon kısıtlaması yok. Epidermoidde DWI parlak.",tag:"common"},
{name:"MS Plakları (Multipl Skleroz)",region:"Beyin",findings:["T2 bright","periventricular","Dawson fingers","open ring enhancement","ovoid lesions","restricted diffusion"],modality:["MR"],keyFeatures:"Periventriküler ovoid lezyonlar (Dawson parmakları), açık halka kontrastlanma. Kallozoseptal arayüz tutulumu.",tag:"important"},
{name:"Toksoplazmoz",region:"Beyin",findings:["ring enhancement","perilesional edema","basal ganglia","multiple lesions","eccentric target sign"],modality:["MR"],keyFeatures:"İmmünsüprese hastada bazal ganglia tutulumu, eksentrik hedef işareti. Lenfomadan ayırıcı tanı: Tl-201 SPECT.",tag:"critical"},
{name:"Primer SSS Lenfoma",region:"Beyin",findings:["homogeneous enhancement","restricted diffusion","periventricular","deep gray matter"],modality:["MR","DWI"],keyFeatures:"Periventriküler yoğun homojen kontrastlanma, difüzyon kısıtlaması. İmmünsüprese hastada: halka tarzı kontrastlanma.",tag:"important"},
{name:"Kraniofarenjiyom",region:"Beyin",findings:["calcification","sellar-suprasellar mass","cystic and solid","T1 bright"],modality:["MR","BT"],keyFeatures:"Sellar/suprasellar kalsifiye kistik-solid kitle. Çocuklarda adamantinömatöz (kalsifikasyon belirgin), yetişkinde papiller tip.",tag:"important"},
{name:"Hipofiz Makroadenom",region:"Beyin",findings:["sellar-suprasellar mass","homogeneous enhancement","snowman sign","cavernous sinus invasion"],modality:["MR"],keyFeatures:"Kardan adam konfigürasyonu (suprasellar uzanım), optik kiazma basısı, kavernöz sinüs invazyonu.",tag:"common"},
{name:"Hemanjioblastom",region:"Beyin",findings:["cystic with mural nodule","posterior fossa","enhancement of nodule","flow voids"],modality:["MR"],keyFeatures:"Posterior fossa kistik lezyon + kontrastlanan mural nodül. Von Hippel-Lindau sendromu ile ilişkili.",tag:"important"},
{name:"Subependimal Dev Hücreli Astrositom (SEGA)",region:"Beyin",findings:["Monro foramen mass","calcification","enhancement","hydrocephalus"],modality:["MR","BT"],keyFeatures:"Monro foramen düzeyinde kontrastlanan kitle, tüberoskleroz kompleksinde görülür. Obstrüktif hidrosefali.",tag:"important"},

// ==================== BAŞ-BOYUN (Head & Neck) ====================
{name:"Pleomorfik Adenom",region:"Baş-boyun",findings:["T2 bright","well-defined","parotid gland mass","homogeneous enhancement","lobulated"],modality:["MR","USG"],keyFeatures:"Parotis bezinde en sık tümör, T2'de çok parlak, düzgün sınırlı lobüle kitle. Yavaş büyüme.",tag:"common"},
{name:"Warthin Tümörü",region:"Baş-boyun",findings:["parotid gland mass","bilateral","multifocal","T2 intermediate","tail of parotid"],modality:["MR","USG"],keyFeatures:"Parotis kuyruğunda, erkeklerde, sigara içenlerde. %10 bilateral. T2'de orta sinyal (pleomorfik adenomdan farklı).",tag:"common"},
{name:"Nazofarenks Karsinomu",region:"Baş-boyun",findings:["nasopharyngeal mass","skull base invasion","retropharyngeal lymph node","Rosenmüller fossa"],modality:["MR","BT","PET-BT"],keyFeatures:"Rosenmüller fossasında kitle, kafa tabanı invazyonu, retrofaringeal LAP. EBV ilişkili, Güneydoğu Asya'da sık.",tag:"critical"},
{name:"Ranula",region:"Baş-boyun",findings:["T2 bright","sublingual space","cystic lesion","plunging extension","no enhancement"],modality:["MR","BT"],keyFeatures:"Sublingual bezden kaynaklanan retansiyon kisti. Dalıcı ranula: mylohyoid kasın altına uzanım gösterir.",tag:"common"},
{name:"Tiroglossal Duktus Kisti",region:"Baş-boyun",findings:["midline neck mass","cystic lesion","hyoid bone level","T2 bright","thin wall enhancement"],modality:["USG","MR","BT"],keyFeatures:"Orta hatta, hyoid kemiği seviyesinde veya infrahyoid kistik lezyon. İnfekte olduğunda duvar kontrastlanması artar.",tag:"common"},
{name:"Brankiyal Yarık Kisti (2. Tip)",region:"Baş-boyun",findings:["lateral neck mass","cystic lesion","angle of mandible","T2 bright","thin wall"],modality:["USG","BT","MR"],keyFeatures:"SCM kasının ön kenarında, mandibula açısı seviyesinde kistik lezyon. En sık 2. brankiyal yarık anomalisi.",tag:"common"},
{name:"Paragangliom (Glomus Tümör)",region:"Baş-boyun",findings:["salt and pepper pattern","flow voids","skull base mass","intense enhancement","vascular mass"],modality:["MR","BT Anjio"],keyFeatures:"Tuz-biber paterni (T1'de flow void + kanama). Glomus jugulare, caroticum, vagale, timpanicum tipleri.",tag:"important"},
{name:"Kolesteatom",region:"Baş-boyun",findings:["restricted diffusion","middle ear mass","bone erosion","no enhancement","Prussak space"],modality:["MR","HRBT"],keyFeatures:"Prussak boşluğunda (pars flaccida tipi) veya posterior mezotimpanumda (pars tensa). DWI'da parlak, kontrastlanmaz.",tag:"important"},

// ==================== TORAKS (Thorax) ====================
{name:"Akciğer Adenokarsinomu",region:"Toraks",findings:["ground glass opacity","part-solid nodule","spiculated margins","air bronchograms","peripheral location"],modality:["BT","PET-BT"],keyFeatures:"Periferal yerleşimli, buzlu cam + solid komponent. Spiküle kenarlar, hava bronkogramları. En sık akciğer kanseri tipi.",tag:"critical"},
{name:"Küçük Hücreli Akciğer Karsinomu",region:"Toraks",findings:["central mass","mediastinal lymphadenopathy","hilar mass","bronchial obstruction","SVC syndrome"],modality:["BT","PET-BT"],keyFeatures:"Santral hiler/mediastinal kitle, masif LAP, VCS sendromu. Hızlı büyüme, erken metastaz.",tag:"critical"},
{name:"İdiyopatik Pulmoner Fibrozis (UIP)",region:"Toraks",findings:["honeycomb pattern","traction bronchiectasis","ground glass opacity","basal predominance","subpleural"],modality:["YRBT"],keyFeatures:"Subpleural, bazal predominans, bal peteği (honeycomb) paterni + traksiyon bronşektazisi. YRBT tanı koydurucu.",tag:"important"},
{name:"Sarkoidoz (Pulmoner)",region:"Toraks",findings:["bilateral hilar lymphadenopathy","perilymphatic nodules","galaxy sign","upper lobe predominance"],modality:["BT","PET-BT"],keyFeatures:"Bilateral simetrik hiler LAP (Löfgren sendromu), perilenfatik mikronodüller, galaksi işareti.",tag:"important"},
{name:"Pulmoner Emboli",region:"Toraks",findings:["filling defect","pulmonary artery","Hampton hump","Westermark sign","mosaic perfusion"],modality:["BT Anjio"],keyFeatures:"Pulmoner arterde dolum defekti. Hampton hörgücü (periferik kama şekilli konsolidasyon), Westermark işareti (oligemi).",tag:"critical"},
{name:"Pnömonitis (Hipersensitivite)",region:"Toraks",findings:["ground glass opacity","centrilobular nodules","mosaic attenuation","air trapping","headcheese sign"],modality:["YRBT"],keyFeatures:"Sentrilübüler buzlu cam nodüller, mozaik atenüasyon (headcheese sign), hava hapsi. Üst-orta lob predominans.",tag:"important"},

{name:"İntrahepatik Safra Yolu Hamartomları (Von Meyenburg)",region:"Abdomen",findings:["multiple small cysts","T2 bright","no enhancement","periportal","tiny lesions"],modality:["MR"],keyFeatures:"Multipl <15 mm periportal kistik lezyonlar, T2 parlak, kontrastlanmaz. Metastazdan ayırıcı tanıda önemli.",tag:"common"},
