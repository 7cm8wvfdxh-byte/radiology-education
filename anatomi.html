<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Kesitsel Anatomi Atlası</title>
<meta name="description" content="İnteraktif Kesitsel Anatomi Atlası — Beyin, Baş-Boyun, Toraks, Abdomen, Pelvis ve Vertebra anatomisi">
<meta name="theme-color" content="#0f172a">
<meta property="og:title" content="Kesitsel Anatomi Atlası">
<meta property="og:description" content="Radyoloji eğitimi için interaktif kesitsel anatomi atlası">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#3b82f6;--accent2:#06b6d4;--danger:#f43f5e;--success:#10b981;--warn:#f59e0b;--radius:16px;}
html{scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;transition:background 0.3s,color 0.3s;}
body.light{--bg:#f8fafc;--bg2:#ffffff;--bg3:#e2e8f0;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}

/* Header */
.header{background:var(--bg2);border-bottom:1px solid var(--bg3);padding:14px 20px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo span{font-size:11px;color:var(--text3);font-weight:500;}
.header-actions{display:flex;gap:8px;}
.hbtn{background:var(--bg);border:1px solid var(--bg3);border-radius:10px;padding:8px 12px;min-height:40px;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;}
.hbtn:hover{border-color:var(--accent);color:var(--accent);}

/* Main */
.main{max-width:900px;margin:0 auto;padding:20px;}

/* Search */
.search-wrap{position:relative;margin-bottom:20px;}
.search-wrap input{width:100%;background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:12px 16px 12px 42px;color:var(--text);font-size:15px;outline:none;transition:border-color 0.2s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--bg3);border-radius:0 0 12px 12px;max-height:360px;overflow-y:auto;display:none;z-index:50;}
.search-results.active{display:block;}
.sr-item{padding:10px 16px;border-bottom:1px solid var(--bg3);cursor:pointer;transition:background 0.15s;}
.sr-item:hover{background:var(--bg);}
.sr-item:last-child{border-bottom:none;}
.sr-name{font-size:14px;font-weight:600;}
.sr-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.sr-meta mark{background:rgba(59,130,246,0.2);color:var(--accent);border-radius:2px;padding:0 2px;}

/* Tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0;}
.tab:hover{border-color:var(--accent);color:var(--accent);}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* Mode Toggle */
.mode-bar{display:flex;gap:8px;margin-bottom:20px;}
.mode-btn{flex:1;background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all 0.2s;}
.mode-btn:hover{border-color:var(--accent);}
.mode-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;}

/* Level Cards */
.level-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:border-color 0.2s;}
.level-card:hover{border-color:var(--accent);}
.level-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;}
.level-num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.level-title{font-size:16px;font-weight:700;}
.level-subtitle{font-size:12px;color:var(--text3);margin-top:1px;}
.level-toggle{margin-left:auto;color:var(--text3);transition:transform 0.3s;font-size:18px;}
.level-toggle.open{transform:rotate(180deg);}
.level-body{display:none;}
.level-body.open{display:block;}

/* SVG Diagram */
.svg-wrap{background:var(--bg);border:1px solid var(--bg3);border-radius:12px;padding:10px;margin-bottom:14px;overflow-x:auto;text-align:center;}
.svg-wrap svg{max-width:100%;height:auto;}

/* Structure List */
.struct-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
@media(max-width:600px){.struct-list{grid-template-columns:1fr;}}
.struct-item{background:var(--bg);border:1px solid var(--bg3);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:8px;}
.struct-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* Clinical Box */
.clinical-box{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.clinical-box h4{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.clinical-box p,.clinical-box li{font-size:13px;color:var(--text2);line-height:1.5;}
.clinical-box ul{padding-left:16px;margin-top:4px;}

.pathology-box{background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.2);border-radius:10px;padding:12px 14px;}
.pathology-box h4{font-size:12px;color:var(--danger);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.pathology-box p,.pathology-box li{font-size:13px;color:var(--text2);line-height:1.5;}
.pathology-box ul{padding-left:16px;margin-top:4px;}

/* Text description cards (for non-SVG regions) */
.anatomy-desc{background:var(--bg);border:1px solid var(--bg3);border-radius:12px;padding:14px;margin-bottom:14px;}
.anatomy-desc h4{font-size:13px;color:var(--accent2);margin-bottom:8px;}
.anatomy-desc ul{padding-left:16px;}
.anatomy-desc li{font-size:13px;color:var(--text2);margin-bottom:4px;line-height:1.5;}
.anatomy-desc .landmark{color:var(--warn);font-weight:600;}

/* Quiz */
.quiz-container{display:none;}
.quiz-container.active{display:block;}
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.quiz-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.quiz-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width 0.3s;}
.quiz-score{font-size:13px;color:var(--text2);font-weight:600;}
.quiz-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--radius);padding:24px;text-align:center;}
.quiz-q{font-size:17px;font-weight:700;margin-bottom:20px;line-height:1.4;}
.quiz-hint{font-size:12px;color:var(--text3);margin-bottom:16px;}
.quiz-opts{display:grid;gap:8px;margin-bottom:16px;}
.quiz-opt{background:var(--bg);border:2px solid var(--bg3);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--text);cursor:pointer;transition:all 0.2s;text-align:left;}
.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.correct{border-color:var(--success);background:rgba(16,185,129,0.1);color:var(--success);}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(244,63,94,0.1);color:var(--danger);}
.quiz-opt.disabled{pointer-events:none;opacity:0.6;}
.quiz-opt.disabled.correct{opacity:1;}
.quiz-explanation{background:var(--bg);border:1px solid var(--bg3);border-radius:10px;padding:14px;font-size:13px;color:var(--text2);margin-bottom:14px;display:none;text-align:left;line-height:1.5;}
.quiz-explanation.show{display:block;}
.quiz-next{background:var(--accent);border:none;border-radius:10px;padding:12px 24px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:none;margin:0 auto;}
.quiz-next.show{display:inline-block;}
.quiz-result{text-align:center;padding:30px;}
.quiz-result h3{font-size:22px;margin-bottom:8px;}
.quiz-result p{color:var(--text2);margin-bottom:16px;}
.quiz-restart{background:var(--accent);border:none;border-radius:10px;padding:12px 24px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}

/* Stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.stat-card{background:var(--bg2);border:1px solid var(--bg3);border-radius:12px;padding:14px;text-align:center;}
.stat-num{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px;}

/* Empty state */
.empty-state{text-align:center;padding:40px;color:var(--text3);}
.empty-state p{font-size:14px;}

/* Footer */
.footer{text-align:center;padding:30px 20px;color:var(--text3);font-size:12px;border-top:1px solid var(--bg3);margin-top:30px;}

@media(max-width:600px){
  .header-inner{flex-wrap:wrap;gap:8px;}
  .logo h1{font-size:17px;}
  .stats-strip{grid-template-columns:1fr 1fr 1fr;}
  .stat-num{font-size:18px;}
  .level-card{padding:14px;}
  .quiz-card{padding:16px;}
}
</style>
</head>

</div>

</div>

<footer class="footer">Kesitsel Anatomi Atlasi &mdash; Radyoloji Egitim Platformu</footer>

function toggleTheme(){
  document.body.classList.toggle('light');
  const isLight=document.body.classList.contains('light');
  localStorage.setItem('anatomy-theme',isLight?'light':'dark');
  document.getElementById('themeBtn').innerHTML=isLight?'&#9790; Tema':'&#9788; Tema';
}
(function(){
  if(localStorage.getItem('anatomy-theme')==='light'){document.body.classList.add('light');document.getElementById('themeBtn').innerHTML='&#9790; Tema';}
})();

{q:'Lomber disk hernisi en sik hangi seviyede gorulur?',opts:['L1-L2','L2-L3','L3-L4','L4-L5'],correct:3,explanation:'Lomber disk hernisi en sik L4-L5 ve L5-S1 seviyelerinde gorulur. L4-L5 hernisi L5 sinir kokunu etkiler (posterolateral herniasyonda).'},
{q:'Chiari I malformasyonunda serebellar tonsillerin foramen magnumun kac mm altina inmesi tanisal kabul edilir?',opts:['3 mm','5 mm','7 mm','10 mm'],correct:1,explanation:'Serebellar tonsillerin foramen magnum altina 5 mm veya daha fazla uzanmasi Chiari I malformasyonu olarak tanilanir.'},
{q:'Prostat kanseri en sik hangi zonda gorulur?',opts:['Transisyonel zon','Santral zon','Periferal zon','Anterior fibromuskuler stroma'],correct:2,explanation:'Prostat kanseri %70-80 oraninda periferal zonda gorulur. T2 agirlikli MRda periferal zondaki hipointens sinyal suphelidir.'},
{q:'Aort diseksiyonunda Stanford tip A siniflamasi neyi ifade eder?',opts:['Sadece desendan aort tutulumu','Asendan aort tutulumu (ark dahil olabilir)','Sadece abdominal aort','Sadece aortik ark'],correct:1,explanation:'Stanford tip A diseksiyonu asendan aortu icerir (arkus ve desendana da uzanabilir). Acil cerrahi gerektirir. Tip B ise sadece desendan aorttur.'},
{q:'Pancoast tumoru hangi torasik yapida yerlesir?',opts:['Anterior mediasten','Orta mediasten','Posterior mediasten','Superior sulkus (akciger apeksi)'],correct:3,explanation:'Pancoast tumoru akciger apeksinde (superior sulkuste) yerlesen bir tumoruddur. Brakiyal pleksus invazyonu ile Horner sendromu ve omuz/kol agrisi yapar.'},
{q:'Hipokampus hangi lob icinde yer alir?',opts:['Frontal lob','Parietal lob','Temporal lob (mesial kisim)','Oksipital lob'],correct:2,explanation:'Hipokampus temporal lobun mesial (ic) kisminda bulunur. Epilepsi cerrahisinde ve Alzheimer hastaliginda onemlidir. Mesial temporal skleroz epilepsinin en sik nedenidir.'},
{q:'Konus medularis normalde hangi vertebral seviyede sonlanir?',opts:['T10','T12','L1-L2','L4-L5'],correct:2,explanation:'Konus medularis (spinal kordun son kismi) normalde L1-L2 hizasinda sonlanir. Daha asagida sonlanirsa tethered kord sendromu dusunulmelidir.'},
{q:'Osteomeatal kompleksin tikandigi durumda en sik hangi sinus etkilenir?',opts:['Sfenoid sinus','Frontal sinus','Maksiller sinus','Posterior etmoid sinus'],correct:2,explanation:'Osteomeatal kompleks maksiller sinusun ve anterior etmoid hucrelerin drenaj yoludur. Tikanikligi en sik maksiller sinuzite neden olur.'},
{q:'AP (aortopulmoner) pencere lenf nodlari buyumesinde en sik hangi malignite dusunulur?',opts:['Meme kanseri','Akciger kanseri','Kolon kanseri','Renal karsinom'],correct:1,explanation:'AP pencere lenf nodlari akciger kanserinde N2 istasyonu olarak degerlendirilir ve evreleme icin kritik oneme sahiptir.'},
{q:'Sol renal ven aorta ve SMA arasinda sikistiginda olusan sendrom hangisidir?',opts:['May-Thurner sendromu','Nutcracker sendromu','Budd-Chiari sendromu','Subclavian steal sendromu'],correct:1,explanation:'Nutcracker sendromunda sol renal ven aorta ile SMA arasinda sikisir. Hematuri ve sol flank agrisina neden olabilir.'},
{q:'Kolesteatom en sik temporal kemigin hangi bolumunde gorulur?',opts:['Dis kulak yolu','Orta kulak (epitimpanum/Prussak boslugundan)','Ic kulak','Internal akustik kanal'],correct:1,explanation:'Kolesteatom en sik Prussak bolgesinde (epitimpanum) baslayan keratinize yassı epitel birikmesidir. Kemik erozyonuna neden olur.'},
{q:'Sakroiliit hangi hastalik grubunun karakteristik bulgusudur?',opts:['Romatoid artrit','Osteoartrit','Spondiloartropatiler (Ankilozan spondilit)','Gut artriti'],correct:2,explanation:'Sakroiliit spondiloartropatilerin (ozellikle ankilozan spondilit) karakteristik bulgusudur. MR erken tani icin en hassas yontemdir (kemik iligi odemi).'},
{q:'Uterusun MRda gorulen junctional zone hangi tabakaya karsilik gelir?',opts:['Endometriyum','Ic myometriyum (ic sirkuler kas)','Dis myometriyum','Seroza'],correct:1,explanation:'Junctional zone (JZ) uterusun ic myometriyum tabakasina karsilik gelir ve T2de hipointens gorulur. Adenomiyozisde JZ kalinligi artar (>12 mm).'},
{q:'4. ventrikul tumoru olarak cocuklarda en sik gorulen tumor hangisidir?',opts:['Meningiom','Medulloblastom','Kraniofaringiom','Hipofiz adenomu'],correct:1,explanation:'Medulloblastom cocuklarda en sik posterior fossa tumorudur ve genellikle serebellar vermiste/4. ventrikul icinde yer alir.'},
{q:'Hangisi anterior mediastenin 4T kuralindaki tumoral patolojilerden biri degildir?',opts:['Timoma','Teratom','Tiroid (retrosternal)','Trakeobronsiyal kist'],correct:3,explanation:'Anterior mediastenin 4T kurali: Timoma, Teratom (germ hucreli tumorler), Tiroid (retrosternal guatr), Terrible lenfoma. Trakeobronsiyal kist orta mediastende yer alir.'},
{q:'Parkinson hastaliginda dejenerasyona ugrayan beyin sapi yapisi hangisidir?',opts:['Nucleus ruber','Substantia nigra','Inferior olivar nukleus','Locus coeruleus'],correct:1,explanation:'Parkinson hastaliginda substantia nigra pars compactadaki dopaminerjik noronlarin dejenerasyonu gorulur. MRda "loss of swallow tail sign" bulgusur.'},
{q:'Abdominal aort anevrizmasinda en sik yerlesim hangisidir?',opts:['Suprarenal','Juxtarenal','Infrarenal','Torakoabdominal'],correct:2,explanation:'Abdominal aort anevrizmasinin en sik yerlesimi infrarenal segmenttir (%85-90). 5.5 cm uzerinde cerrahi endikasyonu vardir.'},
{q:'Weber sendromu hangi beyin sapi yapisinin infarktinda gorulur?',opts:['Pons bazisi','Serebral pedunkul (mezensefalon)','Medulla laterali','Serebellar pedonkul'],correct:1,explanation:'Weber sendromu mezensefalonda serebral pedunkul infarktidir. Ipsilateral CN III paralizisi ve kontralateral hemiparezi gorulur.'},
{q:'Wallenberg sendromu (lateral meduller sendrom) hangi arterin tikanmasinda gorulur?',opts:['Anterior spinal arter','Posterior inferior serebellar arter (PICA)','Anterior inferior serebellar arter (AICA)','Baziler arter'],correct:1,explanation:'Wallenberg sendromu PICA veya vertebral arter tikanmasina bagli lateral medulla infarktidir. Vertigo, disfaji, Horner sendromu ve capraz duyu kusuru gorulur.'},
{q:'Renal hucreli karsinomun karakteristik goruntusu BT\'de nasıldir?',opts:['Her zaman kistik','Hipervaskuuler, heterojen kontrastlanan kitle','Kalsifiye kitle','Yag iceren kitle'],correct:1,explanation:'Renal hucreli karsinom (RCC) tipik olarak hipervaskuler, heterojen kontrastlanan bir kitle olarak gorulur. Clear cell RCC en sik alt tipidir ve yogun kontrast tutulumu gosterir.'}
];

// ===== RENDERING =====
let currentRegion='beyin';
let currentMode='atlas';
let expandedLevels=new Set();

function setMode(mode){
  currentMode=mode;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>{
    b.classList.toggle('active',i===0?mode==='atlas':mode==='quiz');
  });
  document.getElementById('atlasContent').style.display=mode==='atlas'?'block':'none';
  document.getElementById('quizContainer').classList.toggle('active',mode==='quiz');
  document.querySelector('.tabs').style.display=mode==='atlas'?'flex':'none';
  if(mode==='quiz') initQuiz();
  else renderRegion();
}

function selectRegion(region){
  currentRegion=region;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.region===region));
  expandedLevels.clear();
  renderRegion();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>selectRegion(t.dataset.region));
});

function toggleLevel(id){
  if(expandedLevels.has(id)) expandedLevels.delete(id);
  else expandedLevels.add(id);
  renderRegion();
}

function renderRegion(){
  const levels=anatomyData[currentRegion]||[];
  const container=document.getElementById('atlasContent');
  let html='';
  levels.forEach(lv=>{
    const isOpen=expandedLevels.has(lv.id);
    html+=`<div class="level-card">
      <div class="level-header" onclick="toggleLevel('${lv.id}')">
        <div class="level-num">${lv.level}</div>
        <div><div class="level-title">${lv.title}</div><div class="level-subtitle">${lv.subtitle}</div></div>
        <div class="level-toggle ${isOpen?'open':''}">&#9660;</div>
      </div>
      <div class="level-body ${isOpen?'open':''}">`;
    if(lv.svg){
      html+=`<div class="svg-wrap">${lv.svg}</div>`;
    }
    if(lv.structures&&lv.structures.length){
      html+=`<div class="struct-list">`;
      const colors=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#f43f5e','#f97316','#ec4899','#14b8a6','#a78bfa'];
      lv.structures.forEach((s,i)=>{
        html+=`<div class="struct-item"><span class="struct-dot" style="background:${colors[i%colors.length]}"></span>${s}</div>`;
      });
      html+=`</div>`;
    }
    if(lv.clinical){
      html+=`<div class="clinical-box"><h4>Klinik Onem</h4><p>${lv.clinical}</p></div>`;
    }
    if(lv.pathologies&&lv.pathologies.length){
      html+=`<div class="pathology-box"><h4>Sik Gorulen Patolojiler</h4><ul>`;
      lv.pathologies.forEach(p=>{html+=`<li>${p}</li>`;});
      html+=`</ul></div>`;
    }
    html+=`</div></div>`;
  });
  if(!levels.length) html='<div class="empty-state"><p>Bu bolge icin icerik hazirlaniyor.</p></div>';
  container.innerHTML=html;
}

// ===== SEARCH =====
const searchInput=document.getElementById('searchInput');
const searchResults=document.getElementById('searchResults');
let searchIndex=[];
(function buildSearchIndex(){
  const regionNames={beyin:'Beyin',basboyin:'Bas-Boyun',toraks:'Toraks',abdomen:'Abdomen',pelvis:'Pelvis',vertebra:'Vertebra'};
  Object.keys(anatomyData).forEach(region=>{
    anatomyData[region].forEach(lv=>{
      if(lv.structures) lv.structures.forEach(s=>{
        searchIndex.push({text:s,level:lv.title,region:region,regionName:regionNames[region],id:lv.id});
      });
      if(lv.pathologies) lv.pathologies.forEach(p=>{
        searchIndex.push({text:p,level:lv.title,region:region,regionName:regionNames[region],id:lv.id,type:'patoloji'});
      });
      searchIndex.push({text:lv.title+' '+lv.subtitle,level:lv.title,region:region,regionName:regionNames[region],id:lv.id,type:'seviye'});
    });
  });
})();

searchInput.addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  if(q.length<2){searchResults.classList.remove('active');return;}
  const matches=searchIndex.filter(item=>item.text.toLowerCase().includes(q)).slice(0,15);
  if(!matches.length){searchResults.innerHTML='<div class="sr-item"><div class="sr-name" style="color:var(--text3)">Sonuc bulunamadi</div></div>';searchResults.classList.add('active');return;}
  let html='';
  matches.forEach(m=>{
    const highlighted=m.text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<mark>$1</mark>');
    html+=`<div class="sr-item" onclick="goToResult('${m.region}','${m.id}')">
      <div class="sr-info"><div class="sr-name">${highlighted}</div>
      <div class="sr-meta">${m.regionName} &rarr; ${m.level} ${m.type?'('+m.type+')':''}</div></div></div>`;
  });
  searchResults.innerHTML=html;
  searchResults.classList.add('active');
});

searchInput.addEventListener('blur',()=>{setTimeout(()=>searchResults.classList.remove('active'),200);});
searchInput.addEventListener('focus',function(){if(this.value.trim().length>=2)searchResults.classList.add('active');});

function goToResult(region,id){
  setMode('atlas');
  selectRegion(region);
  expandedLevels.add(id);
  renderRegion();
  searchInput.value='';
  searchResults.classList.remove('active');
  setTimeout(()=>{
    const card=document.querySelector(`[onclick="toggleLevel('${id}')"]`);
    if(card) card.closest('.level-card').scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}

// ===== QUIZ =====
let quizState={current:0,score:0,answered:false,order:[]};

function initQuiz(){
  quizState={current:0,score:0,answered:false,order:shuffleArray([...Array(quizQuestions.length).keys()])};
  updateQuizUI();
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function updateQuizUI(){
  const total=quizQuestions.length;
  const idx=quizState.current;
  document.getElementById('quizBar').style.width=((idx/total)*100)+'%';
  document.getElementById('quizScore').textContent=quizState.score+'/'+total;
  if(idx>=total){
    const pct=Math.round((quizState.score/total)*100);
    let emoji=pct>=80?'Mukemmel!':pct>=60?'Iyi!':'Calismayi surdurun.';
    document.getElementById('quizCard').innerHTML=`<div class="quiz-result">
      <h3>${pct}% Basari</h3>
      <p>${quizState.score}/${total} dogru - ${emoji}</p>
      <button class="quiz-restart" onclick="initQuiz()">Tekrar Baslat</button>
    </div>`;
    return;
  }
  const qData=quizQuestions[quizState.order[idx]];
  let html=`<div class="quiz-q">${qData.q}</div><div class="quiz-hint">Soru ${idx+1}/${total}</div><div class="quiz-opts">`;
  qData.opts.forEach((opt,i)=>{
    html+=`<div class="quiz-opt" onclick="answerQuiz(${quizState.order[idx]},${i},this)">${opt}</div>`;
  });
  html+=`</div><div class="quiz-explanation" id="quizExpl">${qData.explanation}</div>`;
  html+=`<button class="quiz-next" id="quizNext" onclick="nextQuiz()">Sonraki Soru &rarr;</button>`;
  document.getElementById('quizCard').innerHTML=html;
  quizState.answered=false;
}

function answerQuiz(qIdx,optIdx,el){
  if(quizState.answered) return;
  quizState.answered=true;
  const qData=quizQuestions[qIdx];
  const opts=document.querySelectorAll('.quiz-opt');
  opts.forEach((o,i)=>{
    o.classList.add('disabled');
    if(i===qData.correct) o.classList.add('correct');
  });
  if(optIdx===qData.correct){
    el.classList.add('correct');
    quizState.score++;
  } else {
    el.classList.add('wrong');
  }
  document.getElementById('quizExpl').classList.add('show');
  document.getElementById('quizNext').classList.add('show');
  document.getElementById('quizScore').textContent=quizState.score+'/'+quizQuestions.length;
}

function nextQuiz(){
  quizState.current++;
  updateQuizUI();
}

// ===== INIT =====
renderRegion();
</script>
